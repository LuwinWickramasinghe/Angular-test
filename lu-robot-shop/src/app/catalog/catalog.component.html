<div class="container">
  <div class="filters">
    <button class="button" (click)="filter='Heads'">Heads</button>
    <button class="button" (click)="filter='Arms'">Arms</button>
    <button class="button" (click)="filter='Torsos'">Torsos</button>
    <button class="button" (click)="filter='Bases'">Bases</button>
    <button class="button" (click)="filter='All'">All</button>
  </div>
  
  
    <ul class="products">
      <li class="product-item" *ngFor="let product of getFilteredProducts()">
        <div class="product">
          <div class="product-details">
            <img [src]="getImageUrl(product)" [alt]="product?.name" />
            <div class="product-info">
              <div class="name">{{ product?.name }}</div>
              <div class="description">{{ product?.description }}</div>
              <div class="category">Part Type: {{ product?.category }}</div>
            </div>
          </div>
          <div class="price">
            <div [ngClass] = "getDiscountedClasses(product)">
              {{ product.price | currency:'LKR' }}
           </div>
            <div class="discount" *ngIf="product.discount > 0">
              {{ (product.price * (1 - product.discount)) | currency:'LKR' }}
            </div>
            <button class="cta">Buy</button>
          </div>
        </div>
      </li>
    </ul>
  </div>
